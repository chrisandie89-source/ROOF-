<style>
/* ---- theme tokens ---- */
:root,html[data-theme=dark]{
  --page1:#0f1714;--page2:#121716;--page3:#131414;--glow:rgba(30,105,72,.20);
  --text:#FFFFFF;--dim:rgba(255,255,255,.66);--label:rgba(255,255,255,.88);
  --glass:rgba(255,255,255,.06);--surf2:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--shadow:none;
  --field-bg:rgba(255,255,255,.06);--field-bd:rgba(255,255,255,.42);--ph:rgba(255,255,255,.58);
  --icon-bg:rgba(255,255,255,.10);
  --card-bg:#FFFFFF;--card-text:#16181A;--card-dim:#555C58;--tag-bg:#EAEEEA;--tag-text:#2B312E;
  --prim-bg:#C4F135;--prim-fg:#16181A;--sel-bg:#FFFFFF;--sel-fg:#16181A;--accent:#C4F135;
  --sheet-bg:#151819;--nav-bg:rgba(20,22,22,.92);--nav-dim:rgba(255,255,255,.70);
  --toast-bg:#FFFFFF;--toast-fg:#16181A;--track:rgba(255,255,255,.14);--step-off:rgba(255,255,255,.42);
  --bar:rgba(255,255,255,.30);--bar-top:#C4F135;--off-bg:rgba(255,255,255,.14);
}
html[data-theme=light]{
  --page1:#F5F7F5;--page2:#EFF2EF;--page3:#E9ECE9;--glow:transparent;
  --text:#16181A;--dim:#555C58;--label:#2B312E;
  --glass:#FFFFFF;--surf2:#F0F3F0;--bd:rgba(22,24,26,.12);--shadow:0 1px 3px rgba(22,24,26,.08);
  --field-bg:#F6F8F6;--field-bd:#848B87;--ph:#686F6B;
  --icon-bg:#EAEEEA;
  --card-bg:#FFFFFF;--card-text:#16181A;--card-dim:#555C58;--tag-bg:#EAEEEA;--tag-text:#2B312E;
  --prim-bg:#16181A;--prim-fg:#C4F135;--sel-bg:#16181A;--sel-fg:#FFFFFF;--accent:#44690A;
  --sheet-bg:#FFFFFF;--nav-bg:rgba(255,255,255,.94);--nav-dim:#555C58;
  --toast-bg:#16181A;--toast-fg:#FFFFFF;--track:rgba(22,24,26,.14);--step-off:rgba(22,24,26,.45);
  --bar:rgba(22,24,26,.26);--bar-top:#16181A;--off-bg:rgba(22,24,26,.10);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:500 13.5px/1.5 'Manrope',system-ui,sans-serif;color:var(--text);background:var(--page2);min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(80% 40% at 90% 0%,var(--glow),transparent 65%),linear-gradient(170deg,var(--page1),var(--page2) 45%,var(--page3))}
h1,h2,h3{font-family:inherit;font-weight:800;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gl{background:var(--glass);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--shadow)}
.top{max-width:720px;margin:auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.03em}
.logo{width:32px;height:32px;border-radius:10px;background:#16181A;border:1px solid var(--bd);display:grid;place-items:center}
.logo img{height:13px;width:auto;display:block}
.topr{display:flex;align-items:center;gap:8px}
.where{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);border-radius:999px;padding:5px 11px 5px 9px;font-size:12px;font-weight:600;background:var(--glass);color:var(--dim)}
main{max-width:720px;margin:auto;padding:16px 16px 120px}
.hero{position:relative;overflow:hidden;border-radius:26px;min-height:300px;display:flex;align-items:flex-end;margin-bottom:12px;isolation:isolate;background:#2a2118}
.hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;z-index:-2}
.hshade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,12,12,.06) 0%,rgba(10,12,12,.30) 38%,rgba(10,12,12,.70) 62%,rgba(10,12,12,.90) 100%)}
.hin{padding:18px;width:100%;color:#fff}
.hin h1{font-size:27px;line-height:1.08}
.hin p{color:rgba(255,255,255,.88);font-size:12.5px;margin:6px 0 14px}
.pg{margin-bottom:16px}
.pg h1,.head h1{font-size:24px;line-height:1.1}
.pg p,.sub{color:var(--dim);font-size:13px;margin-top:6px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.note{background:var(--glass);border:1px solid var(--bd);border-radius:14px;padding:9px 13px;font-size:12px;color:var(--dim);margin-bottom:14px}
.search{display:flex;align-items:center;gap:10px;background:#fff;color:#16181A;border-radius:999px;padding:0 16px;min-height:48px}
.search input{border:0;outline:0;background:none;width:100%;min-height:46px;font-size:16px;font-weight:600;color:#16181A}
.search:focus-within{outline:2px solid #C4F135;outline-offset:2px}
.search input::placeholder{color:#5F6662;font-weight:500}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;height:18px;width:18px;border-radius:50%;cursor:pointer;background:#16181A url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round'><path d='M7 7l10 10M17 7 7 17'/></svg>") center/10px no-repeat}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.ti{flex:none;width:34px;height:34px;border-radius:50%;background:var(--icon-bg);color:var(--text);display:grid;place-items:center}
.tt{display:grid;line-height:1.25;min-width:0}
.tt small{font-size:11px;color:var(--dim);font-weight:500}
.tt b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:none;cursor:pointer}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--bd);background:var(--glass);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--dim);box-shadow:var(--shadow)}
.chip[aria-pressed=true]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.count{color:var(--dim);font-size:12px;margin:12px 2px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card-bg);color:var(--card-text);border-radius:20px;padding:5px 5px 12px;cursor:pointer;display:block;border:1px solid var(--bd);box-shadow:var(--shadow)}
.ph{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:16px;background:#e6e9e6}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pricetag{position:absolute;left:6px;bottom:6px;background:rgba(22,24,26,.86);color:#fff;border-radius:9px;padding:3px 8px;font-weight:700;font-size:12px}
.pricetag small{font-size:10.5px;font-weight:500;color:rgba(255,255,255,.8)}
.heart{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(22,24,26,.72);color:#fff;display:grid;place-items:center;cursor:pointer}
.heart[aria-pressed=true]{background:var(--prim-bg);color:var(--prim-fg)}
.cb{padding:9px 7px 0}
.cb h3{font-size:13px;line-height:1.3;font-weight:700;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:6px}
.tag{font-size:10.5px;font-weight:600;background:var(--tag-bg);border-radius:6px;padding:1px 7px;color:var(--tag-text)}
.loc{display:flex;align-items:center;gap:4px;color:var(--card-dim);font-size:11.5px}
.empty{grid-column:1/-1;border:1px dashed var(--field-bd);border-radius:20px;padding:28px 18px;text-align:center;color:var(--dim);font-size:13px}
.empty .btn{margin-top:14px}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--field-bd);background:var(--glass);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--text);cursor:pointer}
.btn.primary{background:var(--prim-bg);border-color:var(--prim-bg);color:var(--prim-fg)}
.btn.sm{min-height:36px;padding:0 12px;font-size:12.5px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- recovery codes (agents never choose or type a password) ---------- */
function genCode(){
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', b = new Uint8Array(12); crypto.getRandomValues(b);
  const s = [...b].map(x => A[x % A.length]).join('');
  return 'ROOF-' + s.slice(0,4) + '-' + s.slice(4,8) + '-' + s.slice(8,12);
}
function normSecret(v){
  const c = String(v).replace(/[\s-]/g, '').toUpperCase();
  return /^ROOF[A-HJKMNP-Z2-9]{12}$/.test(c) ? 'ROOF-' + c.slice(4,8) + '-' + c.slice(8,12) + '-' + c.slice(12,16) : v;
}

function track(kind, l){
  if (!l || IS_BOT || (S.user && S.user.id === l.agent_id)) return;
  const vid = visitorId(), key = [l.id, kind, lagosDay()].join('|');
  if (seenEv.has(key)) return; seenEv.add(key);
  if (!LIVE) { S.events.push({listing_id:l.id, agent_id:l.agent_id, kind, visitor_id:vid, created_at:new Date().toISOString()}); return; }
  sb.from('events').upsert({listing_id:l.id, agent_id:l.agent_id, kind, visitor_id:vid}, {onConflict:'listing_id,visitor_id,kind,day', ignoreDuplicates:true}).then(r => { if (r.error) console.error(r.error); });

async function createListing(f, photos){
  if (!LIVE) {

    seenStore.set(S.user.id + ':' + nid, rv);

  }
  const urls = [], thumbs = [], store = sb.storage.from('listing-photos');
  for (const p of photos) {
    const base = `${S.user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const opts = {contentType:'image/jpeg', cacheControl:'31536000'};
    const a = await store.upload(base + '.jpg', p.blob, opts); if (a.error) throw a.error;
    const t = await store.upload(base + '-t.jpg', p.thumb, opts); if (t.error) throw t.error;

  const {error} = await sb.from('listings').insert({...f, agent_name:S.user.name, photos:urls, thumbs, review:S.isAdmin ? 'approved' : 'pending'});

/* ---------- photos (resized to save mobile data) ---------- */
function loadImg(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u; }); }
async function compress(file, max = 1280, q = .8){
  const img = await loadImg(file);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', q));
}
async function addPhotos(files){
  for (const f of files) {
    if (S.photos.length >= 8) { toast('You can add up to 8 photos'); break; }
    try { const blob = await compress(f), thumb = await compress(f, 560, .72); S.photos.push({blob, thumb, url:URL.createObjectURL(blob)}); }
    catch { toast('One photo could not be read. Try another.'); }
  }
  drawThumbs();
}

}

/* ---------- agent side ---------- */
function mstats(){
  const uid = S.user.id, now = Date.now(), ms = S.period * DAY;
  const t = x => new Date(x.created_at).getTime();
  const ev = S.events.filter(e => e.agent_id === uid), ld = S.leads.filter(x => x.agent_id === uid);
  const calc = (from, to) => {
    const e = ev.filter(x => t(x) >= from && t(x) < to), l = ld.filter(x => t(x) >= from && t(x) < to);
    const contacts = e.filter(x => x.kind === 'contact').length;
    return {views:e.filter(x => x.kind === 'view').length, saves:e.filter(x => x.kind === 'save').length, contacts, reqs:l.length,
      leads:l.length + contacts, booked:l.filter(x => x.status === 'confirmed' || x.status === 'done').length};
  };
  return {cur:calc(S.period ? now - ms : 0, now + 1), prev:S.period ? calc(now - 2 * ms, now - ms) : null, ev, t};
}
function delta(c, p){
  if (!p) return '';
  const d = Math.round((c - p) / p * 100);
  return `<span class="dl">${d >= 0 ? '+' : '−'}${Math.abs(d)}%</span>`;
}
function drawMetrics(){
  const el = $('#metrics'); if (!el || !S.user) return;
  const m = mstats(), c = m.cur, p = m.prev;
  const tile = (icon, label, key) => `<div class="mt gl"><div class="mtop"><span class="mi">${svg(icon,'none',15)}</span>${p ? delta(c[key], p[key]) : ''}</div><b class="mv">${c[key]}</b><span class="ml">${label}</span></div>`;
  const bars = [], today = new Date(); today.setHours(0,0,0,0);
  for (let i = 6; i >= 0; i--) {
    const from = today.getTime() - i * DAY, to = from + DAY;
    bars.push({n:m.ev.filter(e => e.kind === 'view' && m.t(e) >= from && m.t(e) < to).length, d:new Date(from).toLocaleDateString('en-GB',{weekday:'narrow'})});
  }
  const max = Math.max(1, ...bars.map(b => b.n)), total = bars.reduce((s, b) => s + b.n, 0);

  el.innerHTML = `<div class="mgrid">${tile(P.eye,'Views','views')}${tile(P.heart,'Saves','saves')}${tile(P.cal,'Leads','leads')}${tile(P.calcheck,'Inspections booked','booked')}</div>

    <div class="bars">${bars.map(b => `<div class="bar ${b.n === max && b.n > 0 ? 'peak' : ''}"><i style="height:${Math.max(4, b.n / max * 100)}%"></i><span>${b.d}</span></div>`).join('')}</div></div>
  <div class="cardx gl"><div class="cx-top" style="margin-bottom:0"><div><span class="ml">Requests per 100 views</span><div class="mv" style="margin-top:2px">${conv.toFixed(1)}%</div></div><span class="ml">${c.reqs} of ${c.views} views</span></div>
    <div class="prog" role="img" aria-label="${conv.toFixed(1)} percent of views became requests"><i style="width:${Math.min(100, conv)}%"></i></div></div>`;
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, I = S.insp;
  if (a === 'theme') applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light', true);
  else if (a === 'view') { closeSheet(); S.view = el.dataset.v; render(); window.scrollTo(0,0); }
  else if (a === 'open') openDetail(id);
  else if (a === 'close') closeSheet();
  else if (a === 'contact') track('contact', S.listings.find(x => x.id === id));
  else if (a === 'save') {
    const on = !S.saved.has(id);
    on ? S.saved.add(id) : S.saved.delete(id);
    if (on) track('save', S.listings.find(x => x.id === id));
    if (S.view === 'saved') renderSaved();
    else { el.setAttribute('aria-pressed', on); el.setAttribute('aria-label', on ? 'Remove from saved' : 'Save this house'); el.innerHTML = svg(P.heart, on ? 'currentColor' : 'none', 15); }
  }
  else if (a === 'type') { S.filters.type = el.dataset.v; renderFind(); }
  else if (a === 'clear') { S.filters = {q:'',area:'',type:'All',max:0}; renderFind(); }
  else if (a === 'inspect') startInspect(id);
  else if (a === 'iback') { if (I.step === 1) openDetail(I.id); else { I.step--; renderInspect(); } }
  else if (a === 'iday') {
    I.day = el.dataset.v;
    if (I.day === nextDays()[0].iso) { const h = (SLOTS.find(s => s[0] === I.time) || [0,99])[1]; if (h <= new Date().getHours()) I.time = null; }
    renderInspect();
  }
  else if (a === 'itime') { I.time = el.dataset.v; renderInspect(); }
  else if (a === 'inext') {
    if (I.step === 1) {
      if (I.name.trim().length < 2) return toast('Enter your name.');
      if (normPhone(I.phone).length !== 13) return toast('Enter a valid Nigerian phone number, like 08012345678.');
      I.step = 2;
    } else if (I.step === 2) {
      if (!I.day || !I.time) return toast('Pick a day and a time.');
      I.step = 3;
    }
    renderInspect();
  }
  else if (a === 'isend') {
    const l = S.listings.find(x => x.id === I.id), phone = normPhone(I.phone), key = [l.id, phone, lagosDay()].join('|');
    if (!I.hp && !sentLeads.has(key)) { sentLeads.add(key); saveLead(l, {name:I.name.trim(), phone, slot:slotText(I)}); }
    setTimeout(() => { if (S.insp) { S.insp.step = 4; renderInspect(); } }, 400);
  }
  else if (a === 'period') { S.period = +el.dataset.v; document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === S.period)); drawMetrics(); }
  else if (a === 'leadstatus') {
    try { await setLeadStatus(id, el.dataset.v); drawMetrics(); drawLeads(); toast(el.dataset.v === 'done' ? 'Marked as done' : 'Visit confirmed'); }
    catch { toast('Could not update. Check your connection.'); }
  }
  else if (a === 'showsecret') { const i = $('#secret'); i.type = i.type === 'password' ? 'text' : 'password'; el.textContent = i.type === 'password' ? 'Show code' : 'Hide code'; }
  else if (a === 'copycode') { try { await navigator.clipboard.writeText(S.pendingCode.code); toast('Code copied'); } catch (e) { toast('Press and hold the code to copy it'); } }
  else if (a === 'codego') { if (!$('#codeOk').checked) return; S.pendingCode = null; S.authMode = 'in'; savePending(null); renderNav(); render(); toast('Welcome to Roof'); }
  else if (a === 'resetcode') {
    const ag = S.agentsList.find(x => x.user_id === id); if (!ag) return;
    if (!confirm('Make a new recovery code for ' + (ag.name || ag.email) + '? Their old code stops working and their phone is signed out.')) return;
    const code = genCode();
    try { if (LIVE) { const {error} = await sb.rpc('admin_reset_agent_code', {target:id, new_code:code}); if (error) throw error; }
      S.codeCards = S.codeCards.filter(x => x.id !== id); S.codeCards.unshift({id, code}); drawTell(); toast('New code ready. Send it to the agent now.'); }
    catch (e) { toast('Could not reset: ' + ((e && e.message) || 'check your connection')); }
  }
  else if (a === 'codesent') { setTimeout(() => { S.codeCards = S.codeCards.filter(x => x.id !== id); drawTell(); }, 400); }
  else if (a === 'skipcode') { S.codeCards = S.codeCards.filter(x => x.id !== id); drawTell(); }
  else if (a === 'told') { setTimeout(() => { S.toTell = S.toTell.filter(x => x.id !== id); drawTell(); }, 400); }
  else if (a === 'skiptell') { S.toTell = S.toTell.filter(x => x.id !== id); drawTell(); }
  else if (a === 'dismiss') { const l = S.listings.find(x => x.id === id); if (l && S.user) seenStore.set(S.user.id + ':' + id, l.review || 'approved'); drawNotices(); renderNav(); }
  else if (a === 'rvtab') { S.rvTab = el.dataset.v; S.rejectFor = null; renderReview(); }
  else if (a === 'rejectopen') { S.rejectFor = S.rejectFor === id ? null : id; drawReview(); }
  else if (a === 'approve') { try { await setReview(id, 'approved', null); S.toTell = S.toTell.filter(x => x.id !== id); S.toTell.unshift({id, kind:'approved'}); S.rejectFor = null; renderReview(); renderNav(); toast('Approved. It is live now.'); } catch { toast('Could not update. Check your connection.'); } }
  else if (a === 'reject') { try { await setReview(id, 'rejected', el.dataset.v); S.toTell = S.toTell.filter(x => x.id !== id); S.toTell.unshift({id, kind:'rejected', note:el.dataset.v}); S.rejectFor = null; renderReview(); renderNav(); toast('Rejected. The agent will see the reason.'); } catch { toast('Could not update. Check your connection.'); } }
  else if (a === 'toggleForm') { S.formOpen = !S.formOpen; S.photos = []; renderAgent(); }
  else if (a === 'rmphoto') { S.photos.splice(+el.dataset.i, 1); drawThumbs(); }
  else if (a === 'authMode') { S.authMode = S.authMode === 'up' ? 'in' : 'up'; renderAuth(); }
  else if (a === 'signout') { if (LIVE) await sb.auth.signOut(); S.user = null; S.pendingCode = null; S.authMode = 'in'; savePending(null); S.isAdmin = false; S.formOpen = false; if (S.view === 'review') S.view = 'agent'; render(); }
  else if (a === 'toggleStatus') {
    const l = S.listings.find(x => x.id === id);
    try { await setStatus(id, l.status === 'available' ? 'taken' : 'available'); renderAgent(); toast(l.status === 'taken' ? 'Marked as taken' : 'Marked as available'); }
    catch { toast('Could not update. Check your connection.'); }
  }
  else if (a === 'del') {
    if (!confirm('Delete this listing? This cannot be undone.')) return;
    try { await removeListing(id); renderAgent(); toast('Deleted'); } catch { toast('Could not delete. Check your connection.'); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  const c = e.target.closest && e.target.closest('.card');
  if (c && e.target === c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDetail(c.dataset.id); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') { S.filters.q = e.target.value; updateResults(); }
  if (id === 'iname' && S.insp) S.insp.name = e.target.value;
  if (id === 'iphone' && S.insp) S.insp.phone = e.target.value;
  if (id === 'ihp' && S.insp) S.insp.hp = e.target.value;
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'max') { S.filters.max = +e.target.value; $('#maxTxt').textContent = (BUDGETS.find(b => b[0] === S.filters.max) || BUDGETS[0])[1]; updateResults(); }
  if (id === 'area') { S.filters.area = e.target.value; $('#areaTxt').textContent = e.target.value || 'All Lagos'; updateResults(); }
  if (id === 'files') { addPhotos([...e.target.files]); e.target.value = ''; }
  if (id === 'codeOk') { $('#codeGo').disabled = !e.target.checked; }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, f = Object.fromEntries(new FormData(form));
  if (form.id === 'authForm') {
    if (!LIVE) {
      const em = f.email.trim().toLowerCase(), isNew = !S.demoUsers.has(em), wa = normPhone(f.whatsapp || ''); S.demoUsers.add(em);
      setUser({id:'demo-' + em, email:f.email, name:f.name.trim(), user_metadata:{name:f.name.trim(), whatsapp:wa}});
      S.isAdmin = em === 'admin@roof.demo'; if (!S.isAdmin) seedDemo(S.user.id, S.user.name);
      if (isNew && !S.isAdmin) { S.pendingCode = {code:genCode(), email:f.email, name:f.name.trim()}; S.agentsList.unshift({user_id:S.user.id, name:f.name.trim(), email:f.email, whatsapp:wa, created_at:new Date().toISOString()}); }
      renderNav(); return renderAgent();
    }
    try {
      if (S.authMode === 'up') {
        const name = (f.name || '').trim(), email = f.email.trim().toLowerCase(), wa = normPhone(f.whatsapp || '');
        if (name.length < 2) return toast('Enter your name.');
        if (wa.length !== 13) return toast('Enter a valid Nigerian WhatsApp number, like 08012345678.');
        const code = genCode(); S.pendingCode = {code, email, name};
        const {error} = await sb.auth.signUp({email, password:code, options:{data:{name, whatsapp:wa}}});
        if (error) { S.pendingCode = null; throw error; }
        savePending(S.pendingCode); renderNav(); renderCodeScreen();
      } else {
        const {error} = await sb.auth.signInWithPassword({email:f.email.trim().toLowerCase(), password:normSecret(f.password)});
        if (error) throw error;
      }
    } catch (err) {
      const m = String(err.message || '');
      toast(/already registered/i.test(m) ? 'That email already has an account. Tap "I already have an account" and use your recovery code.' : /invalid login/i.test(m) ? "That email and code don't match. Check the code, or message Roof to get a new one." : (m || 'Could not sign in. Check your details.'));
    }
  }
  if (form.id === 'listForm') {
    const num = normPhone(f.whatsapp);
    if (!S.photos.length) return toast('Add at least one photo.');
    if (num.length !== 13) return toast('Enter a valid Nigerian WhatsApp number, like 08012345678.');
    const btn = $('#postBtn'); btn.disabled = true; btn.textContent = 'Posting…';
    try {
      await createListing({title:f.title.trim(), type:f.type, price:Number(f.price), area:f.area, description:f.description.trim(), whatsapp:num}, S.photos);
      S.photos = []; S.formOpen = false; renderAgent(); toast(S.isAdmin ? 'Posted. It is live now.' : 'Submitted. It goes live once Roof approves it.');
    } catch { btn.disabled = false; btn.textContent = 'Post house'; toast('Could not post. Check your connection and try again.'); }
  }
});

/* ---------- start ---------- */
(async function init(){
  $('#where').innerHTML = svg(P.pin,'none',13) + 'Lagos';
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark', false);
  if (LIVE) {
    try {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const {data} = await sb.auth.getSession(); setUser(data.session && data.session.user); await checkAdmin();
      { const pc = loadPending(); if (pc && S.user && String(S.user.email).toLowerCase() === String(pc.email).toLowerCase()) S.pendingCode = pc; else if (pc) savePending(null); }
      sb.auth.onAuthStateChange((_, s) => { setUser(s && s.user); setTimeout(async () => { await checkAdmin(); try { await load(); } catch (e) {} render(); }, 0); });
      S.listings = [];
      await load();
    } catch { toast('Could not load houses. Check your connection.'); }
  }
  render();
  window.__ready = true;
})();
</script>
</body>
